spring.application.name=backend

# Server
server.port=8081

# PostgreSQL
spring.datasource.username=your_db_user
spring.datasource.password=your_db_password
spring.datasource.url=jdbc:postgresql://localhost:5432/atlas_db

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=your_base64_secret_key_at_least_256_bits
jwt.expiration=5400000
jwt.refreshExpiration=604800000

# Mail (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your@email.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

application.mail.from=no-reply@yourdomain.com
application.mailing.frontend.activation-url=http://localhost:3000/activate

# CORS (comma-separated origins)
cors.allowed-origins=http://localhost:3000,https://app.yourdomain.com

# CRM scheduler
crm.inactivity-threshold-hours=48
crm.max-reminders=3

# FedaPay Mobile Money
payment.fedapay.api-key=${FEDAPAY_API_KEY}
payment.fedapay.environment=sandbox
payment.fedapay.webhook-secret=${FEDAPAY_WEBHOOK_SECRET}

# PayDunya Mobile Money
payment.paydunya.master-key=${PAYDUNYA_MASTER_KEY}
payment.paydunya.public-key=${PAYDUNYA_PUBLIC_KEY}
payment.paydunya.private-key=${PAYDUNYA_PRIVATE_KEY}
payment.paydunya.token=${PAYDUNYA_TOKEN}
payment.paydunya.mode=test

# Twilio (SMS + WhatsApp Business)
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=+1234567890
twilio.whatsapp-number=+1234567890

# Google Calendar OAuth2
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET}
google.calendar.redirect-uri=http://localhost:8081/api/calendar/oauth/callback
