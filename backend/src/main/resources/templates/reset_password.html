<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Réinitialisation de mot de passe</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);">

          <!-- Header -->
          <tr>
            <td style="background:#18181b;padding:28px 40px;">
              <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:-0.5px;">AtlasCRM</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px;">
              <h1 style="margin:0 0 8px;font-size:24px;font-weight:700;color:#18181b;">Réinitialisation du mot de passe</h1>
              <p style="margin:0 0 28px;font-size:15px;color:#71717a;">
                Bonjour <strong th:text="${username}">Utilisateur</strong>,<br/>
                Voici votre code de réinitialisation. Il expire dans <strong>15 minutes</strong>.
              </p>

              <!-- OTP Code -->
              <div style="text-align:center;margin:0 0 32px;">
                <span style="display:inline-block;background:#f4f4f5;border-radius:10px;padding:18px 40px;font-size:36px;font-weight:800;letter-spacing:10px;color:#18181b;font-variant-numeric:tabular-nums;" th:text="${reset_code}">000000</span>
              </div>

              <hr style="border:none;border-top:1px solid #f4f4f5;margin:0 0 24px;"/>
              <p style="margin:0;font-size:13px;color:#a1a1aa;">
                Si vous n'avez pas demandé de réinitialisation, ignorez cet email. Votre mot de passe reste inchangé.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#fafafa;padding:20px 40px;border-top:1px solid #f4f4f5;">
              <p style="margin:0;font-size:12px;color:#a1a1aa;text-align:center;">
                © 2025 AtlasCRM · Plateforme CRM pour agences africaines
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
