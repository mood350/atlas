spring.application.name=backend

#Server
server.port=8081

#PostgreSQL configuration
spring.datasource.username=postgres
spring.datasource.password=Prince@#2006
spring.datasource.url=jdbc:postgresql://localhost:5432/atlas_db

#JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#JWT configuration
jwt.secret=bWFjaGluZXJ5Z292ZXJubWVudHJpZGluZ2Jyb2tlbnN0b3JtcGlwZWdyYWRlZGV2ZWxvcGNvbG9ueW5vdGljZQ==
jwt.expiration=3600000
jwt.refreshExpiration=86400000

# Mail (dev defaults; override in production with real SMTP credentials)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application-specific values used in code
application.mail.from=no-reply@example.com
application.mailing.frontend.activation-url=http://localhost:4200/activate

# CORS allowed origins (comma-separated)
cors.allowed-origins=http://localhost:3000

crm.inactivity-threshold-hours=48
crm.max-reminders=3

# FedaPay Mobile Money
payment.fedapay.api-key=${FEDAPAY_API_KEY:sandbox_key}
payment.fedapay.environment=${FEDAPAY_ENV:sandbox}
payment.fedapay.webhook-secret=${FEDAPAY_WEBHOOK_SECRET:change_me}

# PayDunya Mobile Money
payment.paydunya.master-key=${PAYDUNYA_MASTER_KEY:test_master_key}
payment.paydunya.public-key=${PAYDUNYA_PUBLIC_KEY:test_public_key}
payment.paydunya.private-key=${PAYDUNYA_PRIVATE_KEY:test_private_key}
payment.paydunya.token=${PAYDUNYA_TOKEN:test_token}
payment.paydunya.mode=${PAYDUNYA_MODE:test}

# Twilio (SMS + WhatsApp Business)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:}

# Google Calendar OAuth2
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8081/api/calendar/oauth/callback}